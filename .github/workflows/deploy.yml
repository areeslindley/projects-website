# Workflow for building and deploying Jupyter Book to GitHub Pages
name: Deploy Jupyter Book to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure we're using classic jupyter-book, not myst-cli
          pip uninstall -y myst-cli mystmd 2>/dev/null || true
          pip install --force-reinstall "jupyter-book>=0.15.0,<1.0.0"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install R packages (spatial + IRkernel)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::IRkernel
            any::IRdisplay
            any::tidyterra
            any::terra
            any::geodata
            any::rnaturalearth
            any::rnaturalearthdata
            any::ggplot2
            any::dplyr
            any::tidyverse
            any::sf
            any::sfnetworks
            any::tidygraph
            any::igraph
            any::ggraph
            any::scales
            any::here
            any::rlang
            any::knitr
            any::patchwork
            any::leaflet
            any::htmlwidgets
            any::htmltools
            any::data.table
            any::httr2
            any::readxl
            any::raster
            any::jsonlite
            any::remotes
            any::png

      - name: Register IR Jupyter kernel
        run: Rscript -e "IRkernel::installspec(user = TRUE)"

      - name: Fetch UK urban systems data and run pipeline
        run: |
          Rscript projects/uk-urban-systems-network/scripts/fetch_live_data.R
          Rscript projects/uk-urban-systems-network/scripts/run_pipeline.R

      - name: Build Jupyter Book
        run: |
          # Verify we're using the correct jupyter-book
          which jupyter-book
          jupyter-book --version
          # Build using classic Jupyter Book
          jupyter-book build . --all
          bash scripts/prune_htmlwidget_deps.sh
          bash scripts/sync_build_static.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check internal links
        run: bash scripts/check_links.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the built HTML files
          path: './_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
